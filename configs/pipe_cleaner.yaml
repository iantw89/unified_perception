# Pipe-cleaner end-to-end training configuration — GPU run.
#
# Goals: functional MVP, gradients run e2e, single person, multi-camera,
# multi-timestep.  No denoising.  See development_plan.md for full scope.

data:
  provider: human_prior_aligned
  human_prior_repo: ../human_prior
  human_prior_aligned_dirs:
    - "G:\\My Drive\\FitnessData\\test_output_h36m"
    - "G:\\My Drive\\FitnessData\\test_output_moyo"
    - "G:\\My Drive\\FitnessData\\test_output_mpi3dhp"
  human_prior_h36m_dataset_path: "G:\\My Drive\\FitnessData\\Human3.6"
  human_prior_moyo_dataset_path: "G:\\My Drive\\FitnessData\\MoYo"
  human_prior_mpi_dataset_path: "G:\\My Drive\\FitnessData\\mpi_inf_3dhp"
  image_height: 640
  image_width: 640
  num_cameras: 4
  seq_len: 4
  stride: 1
  val_fraction: 0.1
  split_seed: 0
  batch_size: 16        # num images = num_cameras * batch_size * seq_len
  num_workers: 8       # data on local NVMe SSD; bottleneck is CPU decode — more workers helps
  max_people: 1
  gpu_decode: false   # decode video frames on GPU (requires torchcodec with GPU support)
  use_shuffle_buffer: true
  buffer_frames: 1024  # 4 segs × ~256 frames/seg per worker — ~2.9 GB RSS
  min_buffer_seg: 4   # enforce shuffle diversity by preventing one large segment from dominating
  prefetch_queue_depth: 1  # explicit: 4 pre-staged chunks beyond the pool (was 0=auto before)

model:
  num_joints: 12
  embed_dims: 256
  backbone_type: yolo_pose
  yolo_model_name: yolo11n-pose.pt
  yolo_feature_indices: [16, 19, 22]
  yolo_trainable: false   # YOLO frozen for pipe-cleaner
  num_queries: 64
  num_propagated: 4
  memory_topk: 4
  memory_len: 32
  dec_layers: 6
  dec_heads: 8
  dec_ffn_dim: 2048
  dec_num_pts: 13
  dec_groups: 8
  dropout: 0.1
  with_dn: true

train:
  output_dir: runs/pipe_cleaner_rangefix
  max_epochs: 100
  lr: 0.0004  # 4e-4
  weight_decay: 0.0001
  warmup_iters: 200
  log_interval: 10
  viz_batch_interval: 5000  # save viz every n global steps (0 = off)
  eval_interval: 10        # run validation every n epochs
  device: auto
  seed: 0
  # Standard DETR-family grad-clip without a GradScaler.  StreamPETR uses 35.0
  # only because FP16+GradScaler skips the entire step on any gradient overflow,
  # providing implicit protection that we don't have with bfloat16.
  grad_clip: 1.0

eval:
  pck_thresholds_mm: [50.0, 100.0, 150.0]
  match_threshold_mm: 600.0