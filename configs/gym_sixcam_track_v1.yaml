# Track-query run (TrackFormer-style identity slots, models/tracking.py) on the
# domain fine-tuned curated_v7_al backbone.  Fresh initialization: no weights
# from gym_sixcam_yolov8x_c7.  Sparse-3D experiment (smoke-tested 2026-11-18; full run not started): gym data = the
# golden GT cache rebuilt from data_management catalog v8 (three_d_tracks sha 347ac718...) by
# tools/import_golden.py with interpolated_use=match: 3-D keypoint/root losses only on the 2 Hz
# label frames; between labels, interpolated roots only match queries to present people
# (existence / recall supervision), never a position target.
data:
  provider: gym_mocap_mix
  image_height: 640
  image_width: 640
  num_cameras: 7
  allow_fewer_cameras: true
  seq_len: 8
  # Mixed camera counts are padded and masked, not duplicated.
  batch_size: 4
  # 8: aligned-mocap windows decode from G: Drive at ~3.5 s each; 4 workers stalled steps (smoke 2026-11-18).
  num_workers: 8
  max_people: 24
  stride: 2
  gpu_decode: false
  val_fraction: 0.2
  split_seed: 0
  pixel_mean: [0.0, 0.0, 0.0]
  pixel_std: [255.0, 255.0, 255.0]
  aug_flip_views: false
  human_prior_repo: ../human_prior
  human_prior_aligned_dirs:
    - G:\My Drive\FitnessData\test_output_h36m
    - G:\My Drive\FitnessData\test_output_mpi3dhp
  human_prior_target_fps: 10.0
  human_prior_h36m_dataset_path: G:\My Drive\FitnessData\Human3.6
  human_prior_moyo_dataset_path: G:\My Drive\FitnessData\MoYo
  human_prior_mpi_dataset_path: G:\My Drive\FitnessData\mpi_inf_3dhp
  use_shuffle_buffer: false
  composition_manifest: data/composition_640_c4_s8/cache/experiment.json
  composition_original_fraction: 0.25
  composition_datasets: [h36m, mpi]
  composition_mpi_masks: background
  # Streaming in units of 8-frame windows (1 = one window, the minimum; 0 = the
  # whole recording).  Every pass cuts each clip into consecutive pieces at fresh
  # random places (no window skipped) and shuffles them; shares are fractions of
  # a component's *windows* seen in pieces of each length.  The real domain is
  # hours-long continuous monitoring, so gym windows are mostly seen in long
  # pieces (16 w = 13 s, 128 w = 1.7 min, 1024 w = 14 min at 10 fps, or whole
  # recordings); the shorter true-3D mocap datasets add diversity.
  stream_domain_components: [gym]
  stream_domain_chunks: [16, 128, 1024, 0]
  stream_domain_window_share: [0.10, 0.20, 0.30, 0.40]
  stream_aux_chunks: [1, 4, 16, 0]
  stream_aux_window_share: [0.25, 0.25, 0.25, 0.25]
  # All-camera invisibility of up to this many frames between two observations of
  # an identity keeps the track alive (unsupervised).  Frames of the dataset, so
  # re-derive from seconds x fps for the golden set.
  track_max_gap: 30
  # Drop cameras for a whole streamed piece (down to one view) half of the time: single-view 3-D
  # from true mocap GT, and from triangulated GT on the gym data.
  camera_dropout_prob: 0.5
  camera_dropout_min_views: 1
  # Golden GT (data_management label sets -> tools/import_golden.py): 7 cameras, 10 min at
  # 10 fps, triangulated targets with per-joint sigma + 2-D targets for untriangulated people.
  gym_pseudo3d_root: data_cache/golden_20250505_640
  gym_sample_fraction: 0.5
  gym_mix_aligned_dirs:
    - G:\My Drive\FitnessData\test_output_moyo
  gym_mix_aligned_fraction: 0.15
  # val_aligned decodes MOYO video from G: Drive (~2-3 s per window, ~25 min per eval pass);
  # cached locally as JPEG (0.1 s per window, ~2 GB).  Prebuild:
  #   python -m unified_perception.tools.cache_eval_windows --config configs/gym_sixcam_track_v1.yaml
  eval_window_cache: data_cache/eval_windows
model:
  embed_dims: 256
  position_range: [-8500.0, -14000.0, -200.0, 8500.0, 14000.0, 3000.0]  # golden cache recommendation
  num_joints: 12
  backbone_type: yolo_pose
  # Registered + hash-verified (models/backbones.py); sets the feature layers.
  backbone: yolov8x_pose_p6_curated_v7_al
  yolo_trainable: false
  yolo_force_download: false
  depth_num: 128
  depth_start_mm: 500.0
  depth_max_mm: 24000.0
  lid_depth: true
  num_queries: 64
  dec_layers: 6
  dec_heads: 8
  dec_ffn_dim: 2048
  dec_num_pts: 13
  dec_groups: 8
  dropout: 0.1
  memory_topk: 8
  memory_len: 64
  track_queries: true
  max_tracks: 24
  track_drop_prob: 0.1
  track_fp_prob: 0.1
  track_ref_noise: 0.005
  track_birth_score: 0.5
  track_keep_score: 0.4
  track_max_inactive: 30
  track_nms_mm: 300.0
  # Training assignment on the device (models/gpu_assignment.py): batched cost, GPU Hungarian
  # (torch-linear-assignment Triton kernel), tensor slot rules; no per-frame host round trips.
  gpu_assignment: true
  # Re-identification: query-projection (implicit body shape/motion, per-track EMA)
  # fused with multi-view appearance codes; contrastive loss vs a per-lane bank.
  # reid_wait_frames / reid_threshold are inference-only: sweep them with
  # python -m unified_perception.tools.sweep_reid on a trained checkpoint.
  reid_dims: 128
  reid_appearance: true
  reid_ema: 0.9
  reid_loss_weight: 1.0
  reid_temperature: 0.1
  reid_bank_recent: 16
  reid_bank_anchors: 4
  reid_bank_stride: 8
  reid_wait_frames: 20
  reid_threshold: 0.6
  reid_gallery_size: 128
  # Pretrained person re-ID (fast-reid SBS-R50, MSMT17; exported by
  # tools/export_fastreid.py) on per-view crops of live tracks every 8 frames.
  # Off-the-shelf on the gym GT: same/different-person AUC 0.93, 84% rank-1 of 15.
  reid_external_model: weights/reid/msmt_sbs_R50.ts
  reid_external_stride: 8   # 0.8 s at 10 fps; the per-track appearance EMA changes slowly
  # Fixed crop budget (static shapes, no device sync); usable crops per call measured on the
  # golden cache: mean 84, max 123 (4 lanes x live tracks x usable views).
  reid_external_max_crops: 160
  with_dn: true
  dn_scalar: 10
  dn_noise_scale: 0.2
  dn_split: 0.75
  dn_weight: 1.0
  use_mmcv_msda: true
  cost_class: 2.0
  cost_kpt: 5.0
  loss_class: 2.0
  loss_kpt: 5.0
  focal_alpha: 0.25
  focal_gamma: 2.0
loss:
  root_weight: 5.0
  # Approximate GT (models/supervision.py): errors within 1 sigma of a triangulated target are free;
  # untriangulated people seen by a camera are supervised by 2-D reprojection, never as absent.
  gt_noise_tolerance: 1.0
  gt_sigma_ref_mm: 30.0
  reproj_weight: 1.0
  reproj_tolerance_px: 4.0
  reproj_scale_px: 64.0
  reproj_triangulated_weight: 0.0
  # One Hungarian per frame (final layer) shared by the auxiliary layers; vectorized over layers.
  share_aux_matching: true
train:
  output_dir: runs/gym_sixcam_track_v1
  max_epochs: 100000
  max_steps: 100000
  # sqrt-scaled from 2.8e-4 at batch 8 to batch 4.
  lr: 0.00019796
  weight_decay: 0.0001
  grad_clip: 1.0
  warmup_iters: 200
  log_interval: 10
  ckpt_interval: 1
  ckpt_every_steps: 100
  cuda_memory_fraction: 0.9
  eval_interval: 1
  viz_batch_interval: 5000
  device: cuda
  seed: 0
  resume: null
  compile_model: false
eval:
  pck_thresholds_mm: [50.0, 100.0, 150.0]
  max_eval_batches: 0
  match_threshold_mm: 600.0
